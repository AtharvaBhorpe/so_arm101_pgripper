/gripper_camera/usb_cam:
  ros__parameters:
    # Set by gripper_camera.launch.py. Example for direct driver use only:
    # video_device: /dev/video4  # Device numbering can change.
    image_width: 1280
    image_height: 720
    framerate: 30.0
    pixel_format: mjpeg2rgb
    io_method: mmap
    camera_name: gripper_camera
    frame_id: camera_optical_frame
